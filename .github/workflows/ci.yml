name: Frontend CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Test (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: tripla-frontend-dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            tripla-frontend:${{ github.sha }}
            tripla-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy – CVE scan obrazu
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tripla-frontend:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Save image as tar
        run: docker save tripla-frontend:${{ github.sha }} tripla-frontend:latest -o /tmp/tripla-frontend.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripla-frontend-image-${{ github.sha }}
          path: /tmp/tripla-frontend.tar
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high
