server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bezpieczeństwo – minimum sensownych headerów.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Statyczne assety – długi cache.
    location ~* \.(?:css|js|woff2|woff|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy do backendu – ${API_URL} podstawiane przez nginx envsubst przy starcie kontenera.
    location /api/ {
        proxy_pass         ${API_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # SPA fallback – każda nieznana ścieżka wraca index.html (React Router obsłuży).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Domyślny error fallback.
    error_page 500 502 503 504 /index.html;
}
